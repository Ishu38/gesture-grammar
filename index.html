    <title>MLAF — Multimodal Language Acquisition Framework</title>
    <style>
      /* Inline loading screen — disappears instantly once React mounts */
      #root:empty::before {
        content: '';
        display: block;
        position: fixed; inset: 0;
        background: #05070d;
        z-index: 99999;
      }
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 36px; height: 36px;
        border: 3px solid rgba(74,222,128,0.15);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: mlaf-spin 0.7s linear infinite;
        z-index: 100000;
      }
      #root:not(:empty)::before,
      #root:not(:empty)::after {
        display: none;
      }
      @keyframes mlaf-spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
  </head>
  <body style="margin:0;background:#05070d;">
    <div id="root"></div>
